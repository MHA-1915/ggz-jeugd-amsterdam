<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGZ Jeugd Amsterdam - Overzicht Zorginstellingen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="GGZjeugdAmsterdam.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container overzicht-pagina">
        <h1>Overzicht Zorginstellingen</h1>
        
        <div class="tabs">
            <button class="tab-button active" data-tab="alle">Alle Zorginstellingen</button>
            <button class="tab-button" data-tab="okt">Ouder- en Kindteam</button>
            <button class="tab-button" data-tab="esjh">Enkelvoudige Specialistische Jeugdhulp</button>
            <button class="tab-button" data-tab="hsjh">Hoogspecialistische Jeugdhulp</button>
        </div>
        
        <div class="search-container">
            <input type="text" id="zoekbalk" class="form-control" placeholder="Zoek op naam, adres of specialisatie...">
        </div>
        
        <div id="resultaten-teller" class="resultaten-teller"></div>
        
        <div class="table-responsive">
            <table id="zorginstellingen-tabel" class="table table-striped">
                <thead>
                    <tr>
                        <th>Naam</th>
                        <th>Type</th>
                        <th>Adres</th>
                        <th>Telefoon</th>
                        <th>Leeftijd</th>
                        <th>Specialisaties</th>
                        <th>Links</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- De tabel wordt gevuld door JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="GGZjeugdAmsterdam.js"></script>
</body>
</html>
